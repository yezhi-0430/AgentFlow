name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # tracing extra 提供 langfuse；测试默认关闭追踪、不联网
      - run: python -m pip install -e "./backend[dev,tracing]"
      - run: python -m pytest backend/tests -q
      # 确定性假模型实验冒烟：不联网、不调用付费模型
      - run: python scripts/run_experiment.py --config single --limit 2 --output /tmp/experiment_smoke.json
        working-directory: backend
      - run: python -m pip wheel --no-deps ./backend -w .artifacts
      - run: python scripts/check_repo.py
