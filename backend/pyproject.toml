[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentflow"
version = "0.1.0"
description = "Local visual workspace for multi-agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "AgentFlow Team"}]
dependencies = [
  "fastapi>=0.104.0,<1",
  "uvicorn[standard]>=0.24.0,<1",
  "pydantic>=2.0.0,<3",
  "openai>=1.0.0,<3",
  "sqlalchemy>=2.0.0,<3",
  "alembic>=1.12.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0,<10", "httpx>=0.25.0,<1"]
# 追踪适配器按 Langfuse Python SDK 5.x（OpenTelemetry 内核）编写，2.x/3.x API 不兼容
tracing = ["langfuse>=5.0,<6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["agentflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
